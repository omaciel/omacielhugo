baseURL = "https://omaciel.github.io/"
defaultContentLanguage = "en"
enableEmoji = true
enableRobotsTXT = true
locale = "en-us"
pygmentsStyle = "monokai"
theme = "azulejo"
title = "Og Maciel's Journal"

[params]
  name = "Og Maciel"
  since = 2005
  description = "Reflections on technology, reading, life, and everything in between"
  metaKeywords = ["blog", "technology", "books", "reading", "software engineering", "quality engineering"]
  avatarURL = "/images/cartoon_avatar.gif"
  avatarAltText = "Cartoon portrait of Og Maciel, smiling behind round glasses"
  # Static image used for social-share previews (og:image/twitter:image),
  # since animated GIFs render poorly (first frame only) on X/LinkedIn/Facebook.
  ogImage = "/images/cartoon_avatar_og.png"
  homePostCount = 6

  socialIcons = [
    {name = "github", url = "https://github.com/omaciel"},
    {name = "linkedin", url = "https://www.linkedin.com/in/ogmaciel/"},
    {name = "instagram", url = "http://instagram.com/ogmaciel"},
    {name = "amazon", url = "https://www.amazon.com/author/ogmaciel"},
    {name = "goodreads", url = "https://www.goodreads.com/author/show/7762080.Og_Maciel"},
    {name = "substack", url = "https://ogmaciel.substack.com/"},
    {name = "email", url = "mailto:og@omaciel.com"},
    {name = "rss", url = "/index.xml"}
  ]

  # Home page headline: "<before> <struck> (corrected to <inserted>) <after>"
  [params.hero]
    before = "Brazilian-American software engineer and"
    struck = "aspiring"
    inserted = "award-winning"
    after = "novelist."

  [params.newsletter]
    name = "Life in Rough Draft"
    url = "https://ogmaciel.substack.com/"
    blurb = "My newsletter on Substack. Reading, writing, leading engineers, and stories from Brazil, New Jersey, and Chapel Hill."


[menu]
  [[menu.main]]
    name = "Writing"
    url = "/posts/"
    weight = 1

  [[menu.main]]
    name = "Books"
    url = "/books/"
    weight = 2

  [[menu.main]]
    name = "Projects"
    url = "/projects/"
    weight = 3

  [[menu.main]]
    name = "About"
    url = "/about/"
    weight = 4

  [[menu.main]]
    name = "Newsletter"
    url = "https://ogmaciel.substack.com/"
    weight = 5

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 1
    endLevel = 4
    ordered = false

[pagination]
  pagerSize = 25

[taxonomies]
  tag = "tags"
  series = "series"

# Disqus comments
disqusShortname = "journalofanopensourcee"

[minify]
  minifyOutput = true

# Allow raw-HTML content files (e.g. content/books.html). Hugo v0.158+ tightened
# the default security.allowContent policy and otherwise rejects them at build time.
[security]
  allowContent = ['.*']
