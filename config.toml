baseURL = "https://omaciel.github.io/"
defaultContentLanguage = "en"
enableEmoji = true
enableRobotsTXT = true
languageCode = "en-us"
pygmentsStyle = "monokai"
theme = "gokarna"
title = "Og Maciel's Journal"

[params]
  avatarAltText = "Og Maciel"
  avatarSize = "size-m"
  avatarURL = "/images/cartoon_avatar.gif"
  # Static image used for social-share previews (og:image/twitter:image),
  # since animated GIFs render poorly (first frame only) on X/LinkedIn/Facebook.
  ogImage = "/images/cartoon_avatar_og.png"
  description = "Reflections on technology, reading, life, and everything in between"
  footer = "Og Maciel © 2005-2025"
  metaKeywords = ["blog", "technology", "books", "reading", "software engineering", "quality engineering"]
  showBackToTopButton = true
  showPostsOnHomePage = "recent"
  numberPostsOnHomePage = 7
  name = "Og Maciel"
  github = "https://github.com/omaciel"
  linkedin = "https://www.linkedin.com/in/ogmaciel/"
  instagram = "http://instagram.com/ogmaciel"
  amazon = "https://www.amazon.com/author/ogmaciel"
  goodreads = "https://www.goodreads.com/user/show/26849474-og-maciel"
  
  # Custom head HTML for Font Awesome and favicon
  customHeadHTML = '<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><link rel="icon" href="/favicon.ico"><link rel="shortcut icon" href="/favicon.ico"><link rel="apple-touch-icon" href="/images/ogmaciel.jpg">'

  socialIcons = [
    {name = "github", url = "https://github.com/omaciel"},
    {name = "linkedin", url = "https://www.linkedin.com/in/ogmaciel/"},
    {name = "instagram", url = "http://instagram.com/ogmaciel"},
    {name = "amazon", url = "https://www.amazon.com/author/ogmaciel"},
    {name = "goodreads", url = "https://www.goodreads.com/author/show/7762080.Og_Maciel"},
    {name = "substack", url = "https://ogmaciel.substack.com/"},
    {name = "email", url = "mailto:og@omaciel.com"},
    {name = "rss", url = "/index.xml"}
  ]

[menu]
  [[menu.main]]
    name = "Home"
    pre = "<span data-feather='home'></span>"
    url = "/"
    weight = 1

  [[menu.main]]
    name = "Books"
    pre = "<span data-feather='book-open'></span>"
    url = "/books/"
    weight = 2

  [[menu.main]]
    name = "Posts"
    pre = "<span data-feather='book'></span>"
    url = "/posts/"
    weight = 3

  [[menu.main]]
    identifier = "projects"
    name = "Projects"
    pre = "<span data-feather='code'></span>"
    url = "/projects/"
    weight = 4

  [[menu.main]]
    name = "Tags"
    pre = "<span data-feather='tag'></span>"
    url = "/tags/"
    weight = 5

  [[menu.main]]
    name = "About"
    pre = "<span data-feather='user'></span>"
    url = "/about/"
    weight = 6

  [[menu.main]]
    identifier = "rss"
    pre = "<span data-feather='rss'></span>"
    url = "/index.xml"
    weight = 7

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 1
    endLevel = 4
    ordered = false

[pagination]
  pagerSize = 7

[taxonomies]
  tag = "tags"

# Disqus comments
disqusShortname = "journalofanopensourcee"

[minify]
  minifyOutput = true

# Allow raw-HTML content files (e.g. content/books.html). Hugo v0.158+ tightened
# the default security.allowContent policy and otherwise rejects them at build time.
[security]
  allowContent = ['.*']
