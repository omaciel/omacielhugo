baseURL: "https://omaciel.github.io/"
languageCode: "en-us"
title: "Og Maciel's Journal"
theme: "gokarna"

markup:
  goldmark:
    renderer:
      unsafe: true

# googleanalytics: UA-xxxxxxx-x
disqusShortname: journalofanopensourcee
pagination:
  pagerSize: 7

taxonomies:
  tag: "tags"
#  category: "categories"

params:
  # Gokarna theme specific parameters
  description: "Reflections on technology, reading, life, and everything in between"
  avatarurl: "/images/ogmaciel.jpg"
  avatarSize: "size-l"
  avatarAltText: "Og Maciel"
  
  # Social icons for Gokarna theme
  socialicons:
    - name: "github"
      url: "https://github.com/omaciel"
    - name: "linkedin" 
      url: "https://www.linkedin.com/in/ogmaciel/"
    - name: "instagram"
      url: "http://instagram.com/ogmaciel"
    - name: "amazon"
      url: "https://www.amazon.com/author/ogmaciel"
    - name: "goodreads"
      url: "https://www.goodreads.com/author/show/19753.Og_Maciel"
    - name: "email"
      url: "mailto:og@omaciel.com"
  
  # Show posts on homepage
  showpostsonhomepage: "recent"
  numberpostsonhomepage: 5
  
  # Back to top button
  showbacktotopbutton: true
  
  # Copyright
  copyright: "2025"

Author:
  name: "Og Maciel"
  website: "https://omaciel.github.io"
